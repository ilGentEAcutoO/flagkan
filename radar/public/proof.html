<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="description" content="FlagKan proof — accuracy scoreboard, judging rules, and every resolved coin.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>FlagKan — Proof</title>
<link rel="stylesheet" href="/theme.css">
<style>
/* proof — one score card, a flat rules grid, prose, and the table card */
.topbar .in,.wrap{max-width:1060px}
.wrap{padding-top:30px}
h1{font-size:30px;letter-spacing:-.02em;font-weight:800;line-height:1.15}
.lead{color:var(--dim);font-size:15px;max-width:640px;margin-top:6px}
.score{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.stat{padding:18px 22px}
.stat+.stat{border-left:1px solid var(--line)}
.stat .v{font-family:var(--mono);font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v.green{color:var(--grn)}.stat .v.red{color:var(--red)}
.stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-top:4px}
.stat .s{font-size:12px;color:var(--faint)}
.sec{margin-top:44px}
.sec h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);margin-bottom:12px}
#rules{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 28px}
.rule .n{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--acc)}
.rule .t{display:block;font-weight:800;font-size:14.5px;margin-top:1px}
.rule .d{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
.rule .lim{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--cream);border-radius:6px;padding:1px 7px;white-space:nowrap}
.prose{font-size:14px;color:var(--dim);max-width:68ch}
.prose b{color:var(--ink)}
.prose details{margin-top:10px}
.prose summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:13.5px}
.prose details p{margin-top:6px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:800;background:#FFFBF2;white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid #F4EEE2;font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.coinname{font-family:var(--font);font-weight:700;color:var(--ink);font-size:13px}
/* label v2 — headline score with baselines, collecting state, definition box */
[hidden]{display:none!important}
.cap{margin-top:8px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.cmp{margin-top:12px;display:grid;gap:5px}
.cmp .cr{display:grid;grid-template-columns:minmax(64px,auto) 1fr 36px;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);line-height:1.2}
.cmp .cr.me{color:var(--ink);font-weight:700}
.cmp .bar{height:6px;background:var(--cream);border-radius:99px;overflow:hidden}
.cmp .bar i{display:block;height:100%;background:var(--line2);border-radius:99px}
.cmp .cr.me .bar i{background:var(--ink)}
.cmp .pv{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.lift{margin-top:14px;display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--dim)}
.lift .x{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--grn);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lift b{color:var(--ink)}
.tiers td.num{width:1%}
.tiers .tbar{display:inline-block;vertical-align:middle;width:90px;height:6px;background:var(--cream);border-radius:99px;overflow:hidden;margin-right:8px}
.tiers .tbar i{display:block;height:100%;background:var(--red);border-radius:99px}
.collect{margin-top:22px;padding:18px 22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.collect .ct{font-weight:800;font-size:16px}
.collect .cs{color:var(--dim);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.collect .pbar{margin-top:12px;height:6px;background:var(--cream);border-radius:99px;overflow:hidden;max-width:420px}
.collect .pbar i{display:block;height:100%;background:var(--yeldot);border-radius:99px;transition:width .6s var(--ease)}
details.legacy{margin-top:14px;font-size:13px;color:var(--faint)}
details.legacy summary{cursor:pointer;font-weight:700;color:var(--dim)}
details.legacy .lgn{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
details.legacy .lgn b{color:var(--dim);font-weight:700}
details.legacy p{margin-top:6px;max-width:68ch}
.defbox{margin-top:22px;background:var(--cream);border-radius:12px;padding:14px 18px;font-size:14px;max-width:760px}
.defbox .dk{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.defbox p{margin-top:3px;color:var(--ink)}
.defbox details{margin-top:8px;font-size:13px;color:var(--dim)}
.defbox summary{cursor:pointer;font-weight:700;color:var(--ink)}
.defbox details p{color:var(--dim);margin-top:6px}
.defbox .rg{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.rnote{font-size:12.5px;color:var(--faint);margin:-4px 0 14px;max-width:68ch}
@media(max-width:760px){#rules{grid-template-columns:1fr 1fr}}
@media(max-width:640px){
  .wrap{padding-top:22px}
  h1{font-size:26px}
  .stat{padding:12px 10px}
  .stat .v{font-size:22px}
  .stat .k{font-size:10px;letter-spacing:.06em}
  .stat .s{font-size:11px;line-height:1.35;margin-top:2px}
  #rules{grid-template-columns:1fr;gap:16px}
  .score.v2{grid-template-columns:1fr}
  .score.v2 .stat{padding:14px 16px}
  .score.v2 .stat+.stat{border-left:none;border-top:1px solid var(--line)}
  .score.v2 .stat .v{font-size:30px}
  .collect{padding:16px}
  .tiers .tbar{width:48px}
  .sec{margin-top:36px}
  th,td{padding-left:10px;padding-right:10px}
}
</style>
</head>

<div class="topbar"><div class="in">

<div class="wrap">
  <h1 data-i18n="h1">Proof, not promises.</h1>
  <p class="lead" data-i18n="sub"></p>
  <div class="score" id="legacyScore">
    <div class="stat"><div class="v green" id="sAcc">–</div><div class="k" data-i18n="sAcc">accuracy</div><div class="s" data-i18n="sAccS"></div></div>
    <div class="stat"><div class="v" id="sRes">–</div><div class="k" data-i18n="sRes">coins judged</div><div class="s" data-i18n="sResS"></div></div>
    <div class="stat"><div class="v red" id="sRed">–</div><div class="k" data-i18n="sRed">red precision</div><div class="s" data-i18n="sRedS"></div></div>
  </div>
  <div id="v2box" hidden></div>
  <div id="defbox" class="defbox" hidden></div>
  <section class="sec" id="tierSec" hidden><h2 data-i18n="tierT">By confidence tier</h2>
    <div class="tcard"><div class="tscroll"><table class="tiers">
      <thead><tr><th data-i18n="cTier">tier</th><th style="text-align:right" data-i18n="cN">coins</th><th data-i18n="cDead">died within 6h</th></tr></thead>
      <tbody id="tierRows"></tbody>
    </table></div></div>
  </section>
  <section class="sec"><h2 data-i18n="ruleT">The 6 checks</h2><p class="rnote" data-i18n="ruleNote"></p><div id="rules"></div></section>
  <section class="sec"><h2 data-i18n="aiT">The AI judge</h2><div class="prose"><p data-i18n-html="aiD"></p><details><summary data-i18n="outT">How outcomes are settled</summary><p data-i18n-html="outD"></p></details></div></section>
  <section class="sec"><h2 data-i18n="tabT">Every resolved coin</h2>
    <div class="tcard"><div class="tscroll"><table>
      <thead><tr><th data-i18n="cCoin">coin</th><th data-i18n="cLight">light</th><th style="text-align:right" data-i18n="cMove">6h move</th><th style="text-align:right" data-i18n="cOut">outcome</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="mut">loading…</td></tr></tbody>
    </table></div></div>
  </section>
  <footer class="site"><span>FlagKan · SORNKan · Solami + Jev</span><span><a href="/api/proof">api/proof</a> · <a href="/api/rounds?limit=50">api/rounds</a></span></footer>
</div>

whyD:"นิยามเดิมมักนับเหรียญที่แค่หยุดเทรดว่า \"รอด\" เพราะค่าที่วัดตอน 6 ชั่วโมงมาจากคนละแหล่งข้อมูลกับตอนเจอครั้งแรก ทำให้ความแม่นดูดีกว่าการไม่ทำอะไรเลยเกินจริง เรายังแก้ข้อมูลรั่วในการเทรนด้วย: มีค่าหนึ่งถูกเขียนทับหลังเหรียญ crash แล้วหลุดเข้าไปถึงโมเดล ต่อจากนี้ทุกตัวเลขในหน้านี้จะแสดงคู่กับ baseline แบบไม่ทำอะไรเลยที่ต้องชนะให้ได้",
rgT:"ตัดสินเหรียญย้อนหลังทั้งหมดใหม่ด้วย v2: {n} เหรียญ · อัตราตายพื้นฐาน {b} · ความแม่น {a} · แดงแม่น {r}"}};
var L="en";
try{var _l=localStorage.getItem("flagkan_lang");if(_l==="th"||_l==="en")L=_l}catch(e){}
function t(k){return (T[L]&&T[L][k])||T.en[k]||k}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function pct(x){return (x==null||isNaN(Number(x)))?"—":Math.round(Number(x)*100)+"%"}
function applyLang(){var es=document.querySelectorAll("[data-i18n]");for(var i=0;i<es.length;i++){es[i].textContent=t(es[i].getAttribute("data-i18n"))}var hs=document.querySelectorAll("[data-i18n-html]");for(var j=0;j<hs.length;j++){hs[j].innerHTML=t(hs[j].getAttribute("data-i18n-html"))}document.documentElement.lang=L;try{localStorage.setItem("flagkan_lang",L)}catch(e){}document.getElementById("bEN").className=L==="en"?"on":"";document.getElementById("bTH").className=L==="th"?"on":"";renderRules();loadProof();loadRows()}
document.getElementById("bEN").onclick=function(){L="en";applyLang()};
document.getElementById("bTH").onclick=function(){L="th";applyLang()};
(function(){var as=document.querySelectorAll(".nav a");for(var i=0;i<as.length;i++){if(as[i].getAttribute("data-nav")==="proof")as[i].className="on"}})();
function renderRules(){var h="";for(var i=1;i<=6;i++){h+='<div class="rule"><span class="n">0'+i+'</span><span class="t">'+esc(t("r"+i+"t"))+'</span><span class="d">'+esc(t("r"+i+"d"))+'</span><span class="lim">'+esc(t("r"+i+"l"))+"</span></div>"}document.getElementById("rules").innerHTML=h}
var PROOF=null;
function isNum(x){return x!=null&&x!==""&&!isNaN(Number(x))}
function fmtInt(x){return isNum(x)?Number(x).toLocaleString("en-US"):"—"}
function fill(s,o){return String(s).replace(/\{(\w+)\}/g,function(_,k){return o[k]==null?"":o[k]})}
function fmtWhen(ts){try{return new Date(Number(ts)).toLocaleString(L==="th"?"th-TH":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
// one comparison bar row; w in 0..1
function cmpRow(label,v,me){var w=isNum(v)?Math.max(0,Math.min(1,Number(v))):0;return '<div class="cr'+(me?" me":"")+'"><span>'+esc(label)+'</span><span class="bar"><i style="width:'+(w*100).toFixed(1)+'%"></i></span><span class="pv">'+pct(v)+"</span></div>"}
function proofMode(d){var hd=d&&d.headline;if(!hd||typeof hd!=="object")return "legacy";return (hd.ready&&isNum(hd.accuracy))?"ready":"collecting"}
function renderProof(d){if(!d)return;
var mode=proofMode(d),hd=d.headline||{},isV2=mode!=="legacy"||!!d.label_def;
var box=document.getElementById("v2box"),leg=document.getElementById("legacyScore");
// legacy (current production, no v2 fields): exactly the old score card
document.getElementById("sAcc").textContent=pct(d.accuracy);
document.getElementById("sRes").textContent=fmtInt(d.resolved_with_verdict);
document.getElementById("sRed").textContent=pct(d.red_precision);
leg.hidden=mode!=="legacy";
var oP=document.querySelector('[data-i18n-html="outD"]');if(oP)oP.innerHTML=isV2?t("outD"):t("outDv1");
var h="";
if(mode==="ready"){
var base=hd.base_dead_rate;
h+='<div class="score v2">';
h+='<div class="stat"><div class="v green">'+pct(hd.accuracy)+'</div><div class="k">'+esc(t("hAcc"))+'</div><div class="cmp">'+cmpRow(t("me"),hd.accuracy,1)+(isNum(hd.baseline_all_red_accuracy)?cmpRow(t("bAllRed"),hd.baseline_all_red_accuracy):"")+(isNum(hd.baseline_all_yellow_accuracy)?cmpRow(t("bAllYel"),hd.baseline_all_yellow_accuracy):"")+"</div></div>";
h+='<div class="stat"><div class="v red">'+pct(hd.red_precision)+'</div><div class="k">'+esc(t("hRed"))+'</div><div class="cmp">'+cmpRow(t("me"),hd.red_precision,1)+(isNum(base)?cmpRow(t("bAllRed"),base):"")+"</div>"+(isNum(hd.red_recall)?'<div class="s" style="margin-top:6px">'+esc(fill(t("hRecall"),{r:pct(hd.red_recall)}))+"</div>":"")+"</div>";
h+='<div class="stat"><div class="v">'+pct(base)+'</div><div class="k">'+esc(t("hBase"))+'</div><div class="s">'+esc(t("hBaseS"))+"</div></div>";
h+="</div>";
h+='<p class="cap">'+esc(hd.since?fill(t("hCap"),{n:fmtInt(hd.n),since:fmtWhen(hd.since)}):fill(t("hCapN"),{n:fmtInt(hd.n)}))+"</p>";
var baseAlive=isNum(base)?1-Number(base):null;
var lift=isNum(hd.lift_non_red)?Number(hd.lift_non_red):(isNum(hd.alive_rate_non_red)&&baseAlive>0?Number(hd.alive_rate_non_red)/baseAlive:null);
if(isNum(hd.alive_rate_non_red)&&baseAlive!=null){h+='<div class="lift">'+(lift!=null?'<span class="x">×'+lift.toFixed(1)+"</span>":"")+"<span>"+fill(t("liftD"),{a:pct(hd.alive_rate_non_red),b:pct(baseAlive)})+"</span></div>"}
}else if(mode==="collecting"){
var n=isNum(hd.n)?Number(hd.n):0,w=Math.max(0,Math.min(1,n/100));
h+='<div class="collect"><div class="ct">'+esc(t("colT"))+'</div><div class="cs">'+esc(hd.since?fill(t("colS"),{since:fmtWhen(hd.since),n:fmtInt(n)}):fill(t("colSN"),{n:fmtInt(n)}))+'</div><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.min(100,n)+'"><i style="width:'+(w*100).toFixed(1)+'%"></i></div><p class="cs" style="margin-top:10px">'+esc(t("colD"))+"</p></div>";
}
if(mode!=="legacy"){
var lg=d.legacy_v1||{resolved_with_verdict:d.resolved_with_verdict,accuracy:d.accuracy,red_precision:d.red_precision};
h+='<details class="legacy"><summary>'+esc(t("lgT"))+'</summary><div class="lgn"><span>'+esc(t("lgAcc"))+" <b>"+pct(lg.accuracy)+"</b></span><span>"+esc(t("lgRed"))+" <b>"+pct(lg.red_precision)+"</b></span><span>"+esc(t("lgN"))+" <b>"+fmtInt(lg.resolved_with_verdict)+"</b></span></div><p>"+esc(t("lgD"))+"</p></details>";
}
box.innerHTML=h;box.hidden=!h;
// definition + why-we-changed fold (only once the backend speaks label v2)
var db=document.getElementById("defbox");
if(isV2){var ld=d.label_def||{};var dt=(L==="th"?ld.text_th:ld.text_en)||t("defFb");
var rg=d.v2_history_regrade,rgh="";
if(rg&&isNum(rg.n)){rgh='<p class="rg">'+esc(fill(t("rgT"),{n:fmtInt(rg.n),b:pct(rg.base_dead_rate),a:pct(rg.accuracy),r:pct(rg.red_precision)}))+"</p>"+(L==="en"&&rg.note?'<p class="rg">'+esc(rg.note)+"</p>":"")}
db.innerHTML='<div class="dk">'+esc(t("defK"))+"</div><p>"+esc(dt)+'</p><details><summary>'+esc(t("whyT"))+"</summary><p>"+esc(t("whyD"))+"</p>"+rgh+"</details>";db.hidden=false}else{db.hidden=true;db.innerHTML=""}
// tiers table (ready only)
var ts=document.getElementById("tierSec"),tiers=(mode==="ready"&&Array.isArray(hd.tiers))?hd.tiers:[];
if(tiers.length){var th="";for(var i=0;i<tiers.length;i++){var r=tiers[i]||{},k=String(r.tier||"");var lab=T.en["tier_"+k]?t("tier_"+k):k;var bc=(k==="red_sure"||k==="red")?"red":(k==="yellow"||k==="green")?k:"none";var dr=isNum(r.dead_rate)?Math.max(0,Math.min(1,Number(r.dead_rate))):null;
th+='<tr><td><span class="badge '+bc+'">'+esc(lab)+'</span></td><td class="num">'+fmtInt(r.n)+'</td><td><span class="tbar"><i style="width:'+(dr==null?0:dr*100).toFixed(1)+'%"></i></span>'+pct(r.dead_rate)+"</td></tr>"}
document.getElementById("tierRows").innerHTML=th;ts.hidden=false}else{ts.hidden=true}
}
function loadProof(){if(PROOF){renderProof(PROOF);return}fetch("/api/proof").then(function(r){return r.json()}).then(function(d){PROOF=d;renderProof(d)}).catch(function(){})}
function badge(c){c=(c==="red"||c==="yellow"||c==="green")?c:"none";return '<span class="badge '+c+'">'+c+"</span>"}
function loadRows(){fetch("/api/rounds?limit=100&resolved=1").then(function(r){return r.json()}).then(function(d){
var h="",n=0;
for(var i=0;i<d.rounds.length;i++){var x=d.rounds[i];if(x.resolved_at==null)continue;n++;
var mv="—";if(x.mult!=null&&x.mult>0){var up=x.mult>=1;mv='<span class="'+(up?"up":"down")+'">'+(up?"▲":"▼")+Math.round(Math.abs(x.mult-1)*100)+"%</span>"}
var nm=esc((x.name||x.mint.slice(0,8))+"").slice(0,18);
h+="<tr><td>"+'<span class="coinname">'+nm+"</span></td><td>"+badge(x.choice)+'</td><td class="num">'+mv+'</td><td class="num">'+(x.dead?'<span class="oc dead"><i></i>'+esc(t("dead"))+"</span>":'<span class="oc alive"><i></i>'+esc(t("alive"))+"</span>")+"</td></tr>"}
document.getElementById("rows").innerHTML=h||'<tr><td colspan="4" class="mut">'+esc(t("loading"))+"</td></tr>";
}).catch(function(){})}
applyLang();
})();
</script>
</body>
</html>
