<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="description" content="FlagKan — new-coin risk radar. Red / yellow / green verdicts on fresh Solana tokens with on-chain proof.">
<link rel="icon" href="data:,">
<title>FlagKan — Check before you buy</title>
<style>
:root{--bg:#f3f5f9;--card:#ffffff;--line:#e3e8f0;--line2:#cdd5e3;
--ink:#16233f;--dim:#475569;--faint:#64748b;
--red:#dc2626;--redbg:#fdecec;--yel:#9a6a00;--yelbg:#fdf3d7;--grn:#0e9d6e;--grnbg:#def7ec;
--acc:#1e40af;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Sukhumvit Set','Noto Sans Thai',Arial,sans-serif;
--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1060px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand .f{color:var(--red)}
.nav{display:flex;gap:2px;align-items:center}
.nav a{padding:6px 12px;border-radius:8px;color:var(--dim);font-weight:700;font-size:12.5px;white-space:nowrap;text-decoration:none}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--bg);color:var(--ink)}
.lang{margin-left:auto}
.lang button{background:transparent;color:var(--faint);border:1px solid var(--line);border-radius:99px;
padding:4px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.lang button.on{color:var(--ink);border-color:var(--line2);background:var(--bg)}
.wrap{max-width:1060px;margin:0 auto;padding:26px 16px 40px}
.lead{padding:18px 4px 6px;max-width:720px}
.lead h1{font-size:34px;line-height:1.2;letter-spacing:-.02em;font-weight:800}
.lead h1 .r{color:var(--red)}.lead h1 .y{color:#c78d12}.lead h1 .g{color:var(--grn)}
.lead p.sub{margin-top:10px;font-size:15.5px;color:var(--dim);max-width:640px}
.cta{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 22px;border-radius:10px;font-weight:800;font-size:14px;
text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#0d1730}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink)}
.liveband{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;min-width:130px}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .v.green{color:var(--grn)}.stat .v.red{color:var(--red)}
.stat .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.stat .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);margin-right:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-top:22px}
.panel h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:12px}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.step{padding:4px 18px 4px 0}
.step+.step{border-left:1px solid var(--line);padding-left:18px}
.step .n{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--acc)}
.step h3{font-size:15px;font-weight:800;margin:2px 0 4px}
.step p{font-size:13px;color:var(--dim)}
.strip{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-top:22px;
background:var(--ink);color:#fff;border-radius:12px;padding:18px 22px;flex-wrap:wrap}
.strip p{font-size:14px;max-width:640px}
.strip p b{font-weight:800}
.strip .btn{flex:none}
.tracks{margin-top:22px;color:var(--faint);font-size:12.5px;font-family:var(--mono);text-align:center}
footer{margin-top:14px;color:var(--faint);font-size:11px;font-family:var(--mono);
display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
a{color:var(--acc)}
@media(max-width:700px){.steps{grid-template-columns:1fr}.step+.step{border-left:none;border-top:1px solid var(--line);padding:14px 0 0;margin-top:14px}.step{padding:0}.lead h1{font-size:27px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-page="home">
<div class="topbar"><div class="in">
  <a class="brand" href="/"><span class="f">Flag</span>Kan</a>
  <nav class="nav" aria-label="Pages"><a href="/board.html" data-nav="board" data-i18n="navBoard">Board</a><a href="/proof.html" data-nav="proof" data-i18n="navProof">Proof</a><a href="/about.html" data-nav="about" data-i18n="navAbout">About</a></nav>
  <span class="lang"><button id="bEN" class="on" type="button">EN</button><button id="bTH" type="button">ไทย</button></span>
</div></div>
<div class="wrap">
  <div class="lead">
    <h1 data-i18n-html="h1">Check before you buy.</h1>
    <p class="sub" data-i18n="sub"></p>
    <div class="cta"><a class="btn primary" href="/board.html" data-i18n="ctaBoard">Open the board</a><a class="btn ghost" href="/proof.html" data-i18n="ctaProof">How we judge</a></div>
    <div class="liveband" aria-live="polite">
      <div class="stat"><div class="v green" id="sAcc">–</div><div class="k"><span class="live"></span><span data-i18n="sAcc">accuracy</span></div></div>
      <div class="stat"><div class="v" id="sRes">–</div><div class="k" data-i18n="sRes">coins judged</div></div>
      <div class="stat"><div class="v red" id="sRed">–</div><div class="k" data-i18n="sRed">red precision</div></div>
    </div>
  </div>
  <div class="panel"><h2 data-i18n="howT">How it works</h2>
    <div class="steps">
      <div class="step"><div class="n">01</div><h3 data-i18n="s1t">Spot</h3><p data-i18n="s1d"></p></div>
      <div class="step"><div class="n">02</div><h3 data-i18n="s2t">Inspect</h3><p data-i18n="s2d"></p></div>
      <div class="step"><div class="n">03</div><h3 data-i18n="s3t">Judge</h3><p data-i18n="s3d"></p></div>
    </div>
  </div>
  <div class="strip"><p data-i18n-html="strip"></p><a class="btn ghost" href="/proof.html" data-i18n="stripBtn">See the proof</a></div>
  <div class="tracks" data-i18n="tracks"></div>
  <footer><span>FlagKan · SORNKan · Solami + Jev</span><span><a href="/api/proof">api/proof</a> · <a href="/api/rounds?limit=50">api/rounds</a></span></footer>
</div>
<script>
(function(){
"use strict";
var T={
en:{navBoard:"Board",navProof:"Proof",navAbout:"About",
h1:'Check before you buy.',
sub:"FlagKan watches newly boosted Solana tokens and gives each one a risk light — red, yellow, or green. Six hours later the chain itself grades every verdict.",
ctaBoard:"Open the board",ctaProof:"How we judge",
sAcc:"accuracy",sRes:"coins judged",sRed:"red precision",
howT:"How it works",
s1t:"Spot",s1d:"Every minute we pull the newest boosted Solana tokens off the launchpad firehose.",
s2t:"Inspect",s2d:"Solami RPC reads the chain: top holders, early buys, coin age. Same chain anyone can read — no insider data.",
s3t:"Judge",s3d:"The Jev AI judge issues red / yellow / green with written reasons, then the outcome settles on-chain.",
strip:"<b>Dead means down 90%+ or liquidity under $1,000.</b> The scoreboard counts every resolved coin — nothing cherry-picked.",
stripBtn:"See the proof",
tracks:"Built for Colosseum Crypto World's Fair 2026 · AI × Solana Thailand · Solami"},
th:{navBoard:"กระดาน",navProof:"หลักฐาน",navAbout:"เกี่ยวกับ",
h1:"เช็กก่อนซื้อ.",
sub:"FlagKan เฝ้าเหรียญ Solana น้องใหม่ที่ถูกบูสต์ แล้วติดไฟให้ทุกเหรียญ — แดง เหลือง หรือเขียว อีก 6 ชั่วโมงต่อมาเชนจะตัดสินเองว่าคำชี้ถูกหรือผิด",
ctaBoard:"เปิดกระดาน",ctaProof:"ดูวิธีตัดสิน",
sAcc:"ความแม่น",sRes:"เหรียญที่ชี้แล้ว",sRed:"แดงแม่น",
howT:"ทำงานยังไง",
s1t:"จับ",s1d:"ทุกนาทีเราดึงเหรียญ Solana น้องใหม่ที่ถูกบูสต์ล่าสุด",
s2t:"ตรวจ",s2d:"Solami RPC อ่านเชน: รายใหญ่ ยอดซื้อแรก อายุเหรียญ เชนเดียวกับที่ทุกคนอ่านได้ — ไม่มีข้อมูลวงใน",
s3t:"ชี้",s3d:"AI Jev ชี้แดง / เหลือง / เขียว พร้อมเหตุผลเป็นข้อ ๆ แล้วผลตัดสินจริงบนเชน",
strip:"<b>พังคือร่วงเกิน 90% หรือสภาพคล่องต่ำกว่า $1,000</b> ตารางคะแนนนับทุกเหรียญที่รู้ผลแล้ว — ไม่เลือกโชว์เฉพาะตัวที่ถูก",
stripBtn:"ดูหลักฐาน",
tracks:"สร้างเพื่อ Colosseum Crypto World's Fair 2026 · AI × Solana Thailand · Solami"}};
var L="en";
try{var _l=localStorage.getItem("flagkan_lang");if(_l==="th"||_l==="en")L=_l}catch(e){}
function t(k){return (T[L]&&T[L][k])||T.en[k]||k}
function applyLang(){var es=document.querySelectorAll("[data-i18n]");for(var i=0;i<es.length;i++){es[i].textContent=t(es[i].getAttribute("data-i18n"))}var hs=document.querySelectorAll("[data-i18n-html]");for(var j=0;j<hs.length;j++){hs[j].innerHTML=t(hs[j].getAttribute("data-i18n-html"))}document.documentElement.lang=L;try{localStorage.setItem("flagkan_lang",L)}catch(e){}document.getElementById("bEN").className=L==="en"?"on":"";document.getElementById("bTH").className=L==="th"?"on":""}
document.getElementById("bEN").onclick=function(){L="en";applyLang()};
document.getElementById("bTH").onclick=function(){L="th";applyLang()};
function pct(x){return (x==null||isNaN(Number(x)))?"—":Math.round(Number(x)*100)+"%"}
fetch("/api/proof").then(function(r){return r.json()}).then(function(d){
document.getElementById("sAcc").textContent=pct(d.accuracy);
document.getElementById("sRes").textContent=d.resolved_with_verdict==null?"—":d.resolved_with_verdict;
document.getElementById("sRed").textContent=pct(d.red_precision);
}).catch(function(){});
applyLang();
})();
</script>
</body>
</html>
