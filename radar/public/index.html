<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<link rel="icon" href="data:,">
<title>FlagKan — Check before you buy</title>
<style>
:root{--bg:#f4f6fa;--card:#ffffff;--line:#e3e8f0;--line2:#cdd5e3;
--ink:#131722;--dim:#5b6478;--faint:#8b94a7;
--red:#e5484d;--redbg:#fdecec;--yel:#9a6a00;--yelbg:#fdf3d7;--grn:#0e9d6e;--grnbg:#def7ec;
--acc:#2962ff;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Sukhumvit Set',Arial,sans-serif;
--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5}
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand .f{color:var(--red)}
.search{display:flex;gap:6px;flex:1;min-width:220px;max-width:460px}
.search input{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:var(--ink);
padding:7px 10px;font-family:var(--mono);font-size:12px;min-width:0;outline:none}
.search input:focus{border-color:var(--acc)}
.search button{background:var(--ink);border:none;border-radius:8px;color:#fff;font-weight:700;
padding:7px 16px;cursor:pointer;font-size:12.5px;font-family:var(--sans)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);
border-radius:99px;padding:4px 11px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--ink)}
.lang button{background:transparent;color:var(--faint);border:1px solid var(--line);border-radius:99px;
padding:4px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.lang button.on{color:var(--ink);border-color:var(--line2);background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panelhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.panelhead h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
.filter{display:flex;gap:6px}
.filter button{background:transparent;color:var(--faint);border:1px solid var(--line);border-radius:99px;
padding:3px 12px;font-size:11.5px;cursor:pointer;font-family:var(--sans)}
.filter button.on{color:var(--ink);border-color:var(--line2);background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);text-align:left;
padding:7px 10px;border-bottom:1px solid var(--line);font-weight:700;background:var(--card);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:#2b3346;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f0f4fb}
td.num{text-align:right}
.coinname{font-family:var(--sans);font-weight:700;color:var(--ink);font-size:12.5px}
.coinmint{font-size:10px;color:var(--faint)}
.badge{font-family:var(--mono);font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;text-transform:uppercase}
.badge.red{background:var(--redbg);color:var(--red)}
.badge.yellow{background:var(--yelbg);color:var(--yel)}
.badge.green{background:var(--grnbg);color:var(--grn)}
.badge.none{background:var(--bg);color:var(--faint)}
.star{background:none;border:none;cursor:pointer;font-size:14px;color:#c3cad7;padding:0}
.star.lit{color:#e8a100}
.up{color:var(--grn)}.down{color:var(--red)}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(19,23,34,.45);
align-items:flex-start;justify-content:center;padding:34px 14px;overflow-y:auto}
.modal.open{display:flex}
.mcard{background:var(--card);border-radius:14px;max-width:640px;width:100%;padding:20px 22px;
box-shadow:0 24px 70px rgba(19,23,34,.25)}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mhead .nm{font-size:19px;font-weight:800}
.mhead .mt{font-family:var(--mono);font-size:10.5px;color:var(--faint);word-break:break-all}
.x{background:var(--bg);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;
cursor:pointer;font-size:14px;color:var(--dim);flex:none}
.vline{display:flex;gap:10px;align-items:center;margin:12px 0;padding:10px 14px;border-radius:10px;font-weight:800;font-size:15px}
.vline.red{background:var(--redbg);color:var(--red)}
.vline.yellow{background:var(--yelbg);color:var(--yel)}
.vline.green{background:var(--grnbg);color:var(--grn)}
.vline .cf{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;opacity:.8}
.sigrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;
border-bottom:1px solid var(--line);font-size:12.5px}
.sigrow:last-child{border-bottom:none}
.sigrow .sv{font-family:var(--mono);font-size:12px;color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.dot.red{background:var(--red)}.dot.yellow{background:#e8a100}.dot.green{background:var(--grn)}.dot.none{background:#c3cad7}
canvas#chart{width:100%;height:110px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-top:10px}
.mactions{display:flex;gap:8px;margin-top:12px}
.mactions button{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:8px;
padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.mactions button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.mrow h3{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:10px 0 2px}
footer{margin-top:12px;color:var(--faint);font-size:11px;font-family:var(--mono);
display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
a{color:var(--acc);text-decoration:none}
.mut{color:var(--faint)}
@media(max-width:700px){.mrow{grid-template-columns:1fr}.hideS{display:none}}
.rule{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:none}
.st{flex:none;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.st.pass{background:var(--grnbg);color:var(--grn)}
.st.warn{background:var(--yelbg);color:var(--yel)}
.st.fail{background:var(--redbg);color:var(--red)}
.st.na{background:var(--bg);color:var(--faint)}
.rule .rt{flex:1}
.rule .rn{font-weight:700;font-size:12.5px}
.rule .rv{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.prob{display:flex;gap:6px;margin-top:10px}
.prob div{height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;
font-family:var(--mono);font-size:10px;font-weight:800;color:#fff;min-width:34px}
.prob .pr{background:var(--red)}.prob .py{background:#d99a17}.prob .pg{background:var(--grn)}
.whyline{margin-top:10px;padding:9px 12px;background:var(--bg);border:1px solid var(--line);
border-radius:8px;font-size:12.5px}
.evlink{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700}
details.meth{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.meth summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--dim)}
details.meth p{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.6}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <div class="brand"><span class="f">Flag</span>Kan</div>
  <div class="search"><input id="mint" placeholder="paste mint address…" autocomplete="off" spellcheck="false"><button id="go" type="button" data-i18n="gobtn">Check</button></div>
  <div class="chips">
    <span class="chip"><b id="cAcc">–</b> <span data-i18n="acc">acc</span></span>
    <span class="chip"><b id="cN">–</b> <span data-i18n="res">resolved</span></span>
    <span class="chip"><b id="cT">–</b> <span data-i18n="trk">tracked</span></span>
    <span class="lang"><button id="bEN" class="on" type="button">EN</button><button id="bTH" type="button">ไทย</button></span>
  </div>
</div></div>
<div class="wrap">
  <div class="panel">
    <div class="panelhead"><h2 data-i18n="tracked">Tracked — click a row</h2>
      <div class="filter"><button id="fAll" class="on" type="button" data-i18n="fall">All</button><button id="fRed" type="button" data-i18n="fred">Red</button><button id="fStar" type="button" data-i18n="fstar">★</button></div>
    </div>
    <div style="overflow-x:auto"><table>

      <tbody id="rows"><tr><td colspan="8" class="mut">loading…</td></tr></tbody>
    </table></div>
  </div>
  <footer><span>FlagKan · SORNKan · Solami + Jev</span><span><a href="/api/proof">api/proof</a> · <a href="/api/rounds?limit=50">api/rounds</a></span></footer>
</div>
<div id="modal" class="modal"><div class="mcard">
  <div class="mhead"><div><div class="nm" id="dName">–</div><div class="mt" id="dMint">–</div></div><button class="x" id="dClose" type="button">✕</button></div>
  <div id="dVerdict" class="vline yellow">–</div>
  <div id="dProbs" class="prob" style="display:none"></div>
  <div id="dWhy" class="whyline" style="display:none"></div>
  <div id="dTime" class="whyline" style="display:none"></div>
  <div class="mrow"><div><h3 data-i18n="why">Why</h3><div id="sigs"></div></div>
  <div><h3 data-i18n="px">Price</h3><canvas id="chart" width="560" height="110"></canvas></div></div>
  <a id="dEv" class="evlink" href="#" target="_blank" rel="noopener">↗ <span data-i18n="evidence">Verify on explorer</span></a> <a id="dDx" class="evlink" href="#" target="_blank" rel="noopener">↗ <span data-i18n="dxs">Chart</span></a>
  <details class="meth"><summary data-i18n="methT">Our rules</summary><p data-i18n="methB"></p></details>
  <div class="mactions"><button id="dCopy" class="primary" type="button" data-i18n="copy">Copy verdict</button><button id="dWatch" type="button">★</button></div>
</div></div>
<script>
(function(){
"use strict";
var T={
en:{gobtn:"Check",acc:"acc",res:"resolved",trk:"tracked",tracked:"Tracked — click a row",fall:"All",fred:"Red",fstar:"★",coin:"coin",light:"light",conf:"conf",price:"price $",liq:"liq $",top1:"top1 %",out:"outcome",red:"RED — do not buy",yellow:"YELLOW — caution",green:"GREEN — looks OK",dead:"dead",alive:"alive",na:"—",why:"Why",px:"Price",copy:"Copy verdict",copied:"Copied!",r1:"Whale concentration",r2:"Top holders 2-11",r3:"First-minute buys",r4:"Pool liquidity",r5:"Coin age",limit:"limit",failn:"Failed checks",warnn:"Warnings",allpass:"All checks pass",rawv:"Raw rules say",evidence:"Verify on explorer",methT:"Our rules",methB:"6 checks: whale share, holder spread, early buys, liquidity, age, pool flags. Any single red check means RED unless the AI judge overrules with strong counter-evidence. Yellow means caution: small size, set a stop. Green needs ALL at once: whale under 15%, liquidity over $100k, age over 15 min. AI also scores wallet coordination.",h:"h",d:"d",min:"m",entered:"On board since",ageNow:"Chain age now",resolvesIn:"Result in",resolvedDrop:"Drops off",r6:"Linked wallets · AI",sev:"severity",dxs:"DexScreener chart",entry:"entry",act:"trades/5m"},
th:{gobtn:"ตรวจ",acc:"แม่น",res:"ตัดสิน",trk:"ติดตาม",tracked:"กำลังติดตาม — กดแถวดูรายละเอียด",fall:"ทั้งหมด",fred:"แดง",fstar:"★",coin:"เหรียญ",light:"ไฟ",conf:"มั่นใจ",price:"ราคา $",liq:"liq $",top1:"top1 %",out:"ผล",red:"แดง — อย่าซื้อ",yellow:"เหลือง — ระวัง",green:"เขียว — พอได้",dead:"พัง",alive:"รอด",na:"—",why:"ทำไม",px:"ราคา",copy:"คัดลอกคำชี้",copied:"คัดลอกแล้ว!",r1:"รายใหญ่สุดถือ",r2:"รายใหญ่ลำดับ 2-11",r3:"ยอดซื้อ 1 นาทีแรก",r4:"สภาพคล่องพูล",r5:"อายุเหรียญ",limit:"เกณฑ์",failn:"ข้อที่ไม่ผ่าน",warnn:"ข้อที่เตือน",allpass:"ผ่านทุกข้อ",rawv:"เกณฑ์ดิบชี้ว่า",evidence:"ตรวจเองบน explorer",methT:"เกณฑ์ 6 ข้อของเรา",methB:"ตรวจ 6 ข้อ: รายใหญ่สุด การกระจาย ยอดซื้อแรก สภาพคล่อง อายุ และพูลน่าสงสัย แดงข้อเดียวเท่ากับไฟแดง เว้นแต่ AI มีหลักฐานแย้ง เหลืองแปลว่าระวัง ลงน้อย ตั้งจุดตัดขาดทุน เขียวต้องผ่านทุกข้อพร้อมกัน: รายใหญ่ต่ำกว่า 15% สภาพคล่องเกิน $100k อายุเกิน 15 นาที AI ให้คะแนนกระเป๋าโยงกันเพิ่มอีกข้อ",h:" ชม.",d:" วัน",min:" นาที",entered:"เข้าบอร์ด",ageNow:"อายุตอนนี้",resolvesIn:"รู้ผลใน",resolvedDrop:"หลุดบอร์ด",r6:"กระเป๋าโยงกัน · AI",sev:"ความรุนแรง",dxs:"กราฟ DexScreener",entry:"เข้า",act:"เทรด/5นาที"}};
var L="en",WATCH={},FILTER="all",LAST=null;
try{WATCH=JSON.parse(localStorage.getItem("flagkan_watch")||"{}")}catch(e){WATCH={}}
function t(k){return (T[L]&&T[L][k])||T.en[k]||k}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function pct(x){return (x==null||isNaN(Number(x)))?t("na"):Math.round(Number(x)*100)+"%"}
function num(x){if(x==null||isNaN(Number(x)))return "—";var n=Number(x);if(n>=1e6)return (n/1e6).toFixed(1)+"M";if(n>=1e3)return (n/1e3).toFixed(1)+"K";if(n<0.01&&n>0)return n.toExponential(1);return String(Math.round(n*10000)/10000)}

document.getElementById("bEN").onclick=function(){L="en";applyLang()};

document.getElementById("fAll").onclick=function(){setFilter("all")};
document.getElementById("fRed").onclick=function(){setFilter("red")};
document.getElementById("fStar").onclick=function(){setFilter("star")};
function loadProof(){fetch("/api/proof").then(function(r){return r.json()}).then(function(d){
document.getElementById("cAcc").textContent=d.accuracy==null?"—":pct(d.accuracy);

function badge(c){c=(c==="red"||c==="yellow"||c==="green")?c:"none";return '<span class="badge '+c+'">'+c+"</span>"}

var rules=[
{rn:t("r1"),rv:(s.top1_pct==null?"?":s.top1_pct+"%")+" · "+t("limit")+" 30%"+(s.pool_suspect?" · (pool?)":""),st:stOf(flag(s.top1_pct,30,15))},

function syncDWatch(){var b=document.getElementById("dWatch");if(!b)return;b.textContent=LAST&&WATCH[LAST]?"★ Watched":"★ Watch"}

function drawChart(hist){var c=document.getElementById("chart");var x=c.getContext("2d");
var W=c.width,H=c.height;x.clearRect(0,0,W,H);
var pts=hist.map(function(p){return Number(p.price_usd)}).filter(function(n){return n>0});
x.fillStyle="#8b94a7";x.font="11px sans-serif";
if(pts.length<2){x.fillText("collecting…",10,18);return}
var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);if(mx===mn)mx=mn*1.01;
var up=pts[pts.length-1]>=pts[0];x.strokeStyle=up?"#0e9d6e":"#e5484d";x.lineWidth=1.6;x.beginPath();
for(var i=0;i<pts.length;i++){var px=4+(W-8)*i/(pts.length-1);var py=H-8-(H-16)*(pts[i]-mn)/(mx-mn);if(i===0){x.moveTo(px,py)}else{x.lineTo(px,py)}}
x.stroke()}
