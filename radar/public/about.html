/* about — plain reading column, no cards */
.topbar .in,.wrap{max-width:1060px}
.wrap{padding-top:30px}
.col{max-width:680px}
h1{font-size:30px;letter-spacing:-.02em;font-weight:800;line-height:1.15}
.sec{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}

.sec h2{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);margin-bottom:8px}
.sec p{font-size:15px;color:var(--dim);line-height:1.7}
.sec p b{color:var(--ink)}
.links{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.links a{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:10px;font-weight:800;font-size:13.5px;text-decoration:none;background:#fff;color:var(--ink);border:1px solid var(--line2);transition:border-color .15s,transform .15s,box-shadow .15s}
.links a:hover{border-color:var(--ink)}
.links a.primary{background:var(--red);color:#fff;border:2px solid var(--ink);box-shadow:var(--sh-hard)}
.links a.primary:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.links a.api{background:none;border:none;padding:0 6px;color:var(--dim);font-family:var(--mono);font-size:12px;font-weight:700}
.links a.api:hover{color:var(--ink);text-decoration:underline}
@media(max-width:640px){.wrap{padding-top:22px}h1{font-size:26px}}

en:{navBoard:"Board",navProof:"Proof",navAbout:"About",

whyT:"Why it exists",

nextT:"What's next",

linkT:"Links",lBoard:"Live board",lProof:"Proof & rules"},
th:{navBoard:"กระดาน",navProof:"หลักฐาน",navAbout:"เกี่ยวกับ",

linkT:"ลิงก์",lBoard:"กระดานสด",lProof:"หลักฐานและเกณฑ์"}};
var L="en";
try{var _l=localStorage.getItem("flagkan_lang");if(_l==="th"||_l==="en")L=_l}catch(e){}
function t(k){return (T[L]&&T[L][k])||T.en[k]||k}
function applyLang(){var es=document.querySelectorAll("[data-i18n]");for(var i=0;i<es.length;i++){es[i].textContent=t(es[i].getAttribute("data-i18n"))}var hs=document.querySelectorAll("[data-i18n-html]");for(var j=0;j<hs.length;j++){hs[j].innerHTML=t(hs[j].getAttribute("data-i18n-html"))}document.documentElement.lang=L;try{localStorage.setItem("flagkan_lang",L)}catch(e){}document.getElementById("bEN").className=L==="en"?"on":"";document.getElementById("bTH").className=L==="th"?"on":""}
document.getElementById("bEN").onclick=function(){L="en";applyLang()};
document.getElementById("bTH").onclick=function(){L="th";applyLang()};
(function(){var as=document.querySelectorAll(".nav a");for(var i=0;i<as.length;i++){if(as[i].getAttribute("data-nav")==="about")as[i].className="on"}})();
applyLang();
