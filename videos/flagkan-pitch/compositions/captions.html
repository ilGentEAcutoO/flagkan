<div id="cap-0" class="clip cap-row" data-start="0.55" data-duration="0.545" data-track-index="0"><span class="cap-box">Every day,</span></div>
<div id="cap-1" class="clip cap-row" data-start="1.095" data-duration="2.81" data-track-index="1"><span class="cap-box">thousands of brand-new tokens launch on Solana.</span></div>
<div id="cap-2" class="clip cap-row" data-start="4.075" data-duration="1.011" data-track-index="0"><span class="cap-box">Six hours later,</span></div>

<div id="cap-4" class="clip cap-row" data-start="7.969" data-duration="0.86" data-track-index="0"><span class="cap-box">Rugged, drained,</span></div>

<div id="cap-6" class="clip cap-row" data-start="9.797" data-duration="2.293" data-track-index="0"><span class="cap-box">And somebody bought every one of them.</span></div>
<div id="cap-7" class="clip cap-row" data-start="13.16" data-duration="1.31" data-track-index="1"><span class="cap-box">And here&#x27;s the trap.</span></div>

<div id="cap-11" class="clip cap-row" data-start="21.639" data-duration="1.969" data-track-index="1"><span class="cap-box">So accuracy alone proves nothing.</span></div>
<div id="cap-12" class="clip cap-row" data-start="23.778" data-duration="2.431" data-track-index="0"><span class="cap-box">The real test is beating that do-nothing baseline,</span></div>

<div id="cap-14" class="clip cap-row" data-start="29.863" data-duration="0.812" data-track-index="0"><span class="cap-box">Meet FlagKan.</span></div>
<div id="cap-15" class="clip cap-row" data-start="30.675" data-duration="1.188" data-track-index="1"><span class="cap-box">A live red, yellow,</span></div>

<div id="cap-18" class="clip cap-row" data-start="36.283" data-duration="3.397" data-track-index="0"><span class="cap-box">Red: don&#x27;t buy. Yellow: caution. Green: lower risk,</span></div>

<div id="cap-36" class="clip cap-row" data-start="67.281" data-duration="0.882" data-track-index="0"><span class="cap-box">A random pick?</span></div>
<div id="cap-37" class="clip cap-row" data-start="68.163" data-duration="1.322" data-track-index="1"><span class="cap-box">Just 2.5 percent.</span></div>
<div id="cap-38" class="clip cap-row" data-start="69.655" data-duration="2.422" data-track-index="0"><span class="cap-box">That&#x27;s about 7 times better than chance,</span></div>

<div id="cap-48" class="clip cap-row" data-start="86.457" data-duration="0.592" data-track-index="0"><span class="cap-box">Why Solana?</span></div>

<div id="cap-55" class="clip cap-row" data-start="97.286" data-duration="1.901" data-track-index="1"><span class="cap-box">And it&#x27;s built in Thailand, Thai-first,</span></div>

<div id="cap-57" class="clip cap-row" data-start="100.6" data-duration="2.59" data-track-index="1"><span class="cap-box">deserve a straight answer in their own language.</span></div>
