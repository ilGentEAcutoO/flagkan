<div id="root" data-composition-id="s8-next" data-width="1920" data-height="1080">

<script>
(function(){
const B1=0.55, B2=7.585, E1=7.165, E2=16.074, D=16.844;
const tl = gsap.timeline({ paused: true });
tl.fromTo(".s8-cam", {scale:1.06}, {scale:1.0, duration:D, ease:"sine.out"}, 0);
// b1: business tiers
tl.fromTo(".s8-kicker", {opacity:0, y:20}, {opacity:1, y:0, duration:0.5, ease:"power3.out"}, Math.max(0, B1 - 0.4));
tl.fromTo(".s8-title", {opacity:0, y:50}, {opacity:1, y:0, duration:0.7, ease:"expo.out"}, Math.max(0, B1 - 0.3));
tl.fromTo(".s8-free", {opacity:0, x:-60}, {opacity:1, x:0, duration:0.6, ease:"back.out(1.5)"}, B1 + 0.5);
const paidT = B1 + Math.max(2.2, (E1 - B1) * 0.42);
tl.fromTo(".s8-paid", {opacity:0, x:-60}, {opacity:1, x:0, duration:0.6, ease:"back.out(1.5)"}, paidT);
const icGap = Math.max(0.35, (E1 - paidT - 0.9) / 3);
[".s8-ic1", ".s8-ic2", ".s8-ic3"].forEach((s, k) => {
  tl.fromTo(s, {opacity:0, scale:0.5}, {opacity:1, scale:1, duration:0.4, ease:"back.out(2.6)"}, paidT + 0.7 + k * icGap);
});
// b2: roadmap
tl.to(".s8-left", {opacity:0.55, duration:0.6}, B2 - 0.2);
tl.fromTo(".s8-rh", {opacity:0, y:30}, {opacity:1, y:0, duration:0.6, ease:"expo.out"}, B2 - 0.3);
tl.fromTo(".s8-rail", {scaleY:0}, {scaleY:1, duration:Math.max(1.5, E2 - B2 - 1.5), ease:"power1.inOut"}, B2 + 0.4);
const span = Math.max(4.5, E2 - B2);
const its = [B2 + 0.8, B2 + span * 0.36, B2 + span * 0.64];
[".s8-r1", ".s8-r2", ".s8-r3"].forEach((s, k) => {
  tl.fromTo(s, {opacity:0, x:60}, {opacity:1, x:0, duration:0.55, ease:"back.out(1.5)"}, its[k]);
  tl.fromTo(s + " .s8-num", {rotation:-90, scale:0.4}, {rotation:0, scale:1, duration:0.5, ease:"back.out(2.2)"}, its[k] + 0.1);
});
window.__timelines["s8-next"] = tl;
})();
