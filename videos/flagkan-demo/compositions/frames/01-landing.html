<script>
(function(){
  var el = function(id){ return document.getElementById(id); };
  var world = el("f01-world");
  var grid = el("f01-grid");
  var ring1 = el("f01-ring1");
  var statbox = el("f01-statbox");
  var judgebox = el("f01-judgebox");
  var c0 = el("f01-c0");
  var c5 = el("f01-c5");
  var s1 = el("f01-s1"), s2 = el("f01-s2"), s3 = el("f01-s3");
  var d1 = el("f01-d1"), d2 = el("f01-d2"), d3 = el("f01-d3");
  var l1 = el("f01-l1"), l2 = el("f01-l2");

  var tl = gsap.timeline({ paused: true });

  function calloutPop(n, at){
    var box = document.querySelector("#f01-c" + n + " .f01-box");
    var tri = document.querySelector("#f01-c" + n + " .f01-tri");
    var sec = document.querySelector("#f01-c" + n + " .f01-sec");
    tl.fromTo(box,
      { opacity: 0, scale: 0, transformOrigin: "52px 110%" },
      { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)" },
      at);
    tl.fromTo(tri,
      { opacity: 0 },
      { opacity: 1, duration: 0.2, ease: "power1.out" },
      at + 0.3);
    tl.fromTo(sec,
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      at + 0.35);
  }
  function ripple(at){
    tl.fromTo(ring1,
      { scale: 0, opacity: 0.9, transformOrigin: "50% 50%" },
      { scale: 3.2, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false },
      at);
  }
  function boxIn(box, at){
    tl.fromTo(box,
      { opacity: 0, scale: 0.96, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.5)" },
      at);
  }
  function boxOut(box, at){
    tl.to(box, { opacity: 0, duration: 0.3, ease: "power2.out" }, at);
  }
  function stationSwap(outEl, inEl, at){
    tl.to(outEl, { opacity: 0, duration: 0.25, ease: "power1.out" }, at);
    tl.fromTo(inEl,
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
      at + 0.2);
  }

  // Station 1 (0-4.6s): hero opens, brand pill, live-pill ripples, stats bracket.
  tl.fromTo(world,
    { opacity: 0, x: 0, y: 0 },
    { opacity: 1, x: 0, y: 0, duration: 0.7, ease: "power2.out" }, 0);
  tl.fromTo(c0,
    { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" },
    { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.8);
  ripple(2.2);
  ripple(2.95);
  boxIn(statbox, 3.4);
  boxOut(statbox, 4.4);

  // Pan 1 (4.6-7.4s): lateral pan to station 2, grid at half-rate parallax.
  tl.to(world, { x: -1920, y: -10, duration: 2.8, ease: "power2.inOut" }, 4.6);
  tl.to(grid, { x: -960, duration: 2.8, ease: "power2.inOut" }, 4.6);
  tl.fromTo(l1,
    { opacity: 1, scaleX: 0, transformOrigin: "0% 50%" },
    { opacity: 1, scaleX: 1, duration: 2.8, ease: "power2.inOut" }, 4.6);
  stationSwap(s1, s2, 5.4);
  tl.fromTo(d2,
    { scale: 0.4, transformOrigin: "50% 50%" },
    { scale: 1, duration: 0.4, ease: "back.out(2)" }, 7.3);
  tl.set(d2, { className: "f01-dot on" }, 7.3);

  // Station 2 (7.4-10.6s): stop 01 arrives, Judge column brackets.
  calloutPop(1, 8.2);
  boxIn(judgebox, 9.3);
  boxOut(judgebox, 10.4);
  calloutPop(2, 10.0);

  // Pan 2 (10.6-13.4s): lateral pan to station 3, parallax continues.
  tl.to(world, { x: -3840, y: 0, duration: 2.8, ease: "power2.inOut" }, 10.6);
  tl.to(grid, { x: -1920, duration: 2.8, ease: "power2.inOut" }, 10.6);
  tl.fromTo(l2,
    { opacity: 1, scaleX: 0, transformOrigin: "0% 50%" },
    { opacity: 1, scaleX: 1, duration: 2.8, ease: "power2.inOut" }, 10.6);
  stationSwap(s2, s3, 11.4);
  tl.fromTo(d3,
    { scale: 0.4, transformOrigin: "50% 50%" },
    { scale: 1, duration: 0.4, ease: "back.out(2)" }, 13.3);
  tl.set(d3, { className: "f01-dot on" }, 13.3);
  calloutPop(3, 12.2);

  // Station 3 (13.4-18s): stop 04 lands, LET'S GO holds to the end.
  calloutPop(4, 14.0);
  tl.fromTo(c5,
    { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" },
    { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 16.1);
  tl.to(c5, { scale: 1.045, duration: 0.35, ease: "power2.out" }, 16.9);
  tl.to(c5, { scale: 1, duration: 0.4, ease: "power2.inOut" }, 17.25);

  // Hold the landed tableau to the end of the slot (no exit: not the final frame).
  tl.set(world, { x: -3840 }, 17.95);

  window.__timelines = window.__timelines || {};
  window.__timelines["01-landing"] = tl;
})();
</script>
