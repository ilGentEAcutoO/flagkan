</style>
<div id="root" data-composition-id="s7-why" data-width="1920" data-height="1080">

<script>
(function(){
const B1=0.55, B2=5.809, B3=12.052, D=18.844;
const art1 = document.getElementById("s7-art1");
const cols = ["#B7321F","#E8A100","#0B7A55","#B7321F","#B7321F","#E8A100","#B7321F"];
const rockets = cols.map((c, k) => {
  const tr = document.createElement("span"); tr.className = "s7-trail"; tr.style.left = (40 + k * 58 + 29) + "px"; tr.style.top = "300px"; art1.appendChild(tr);
  const e = document.createElement("span"); e.className = "s7-launch"; e.style.left = (40 + k * 58) + "px"; e.style.background = c; art1.appendChild(e);
  return [e, tr];
});
const tl = gsap.timeline({ paused: true });
tl.fromTo(".s7-cam", {scale:1.04, y:20}, {scale:1, y:0, duration:D, ease:"sine.inOut"}, 0);
tl.fromTo(".s7-dots", {x:0, y:0}, {x:-36, y:-36, duration:D, ease:"none"}, 0);
// columns enter
[".s7-col-1", ".s7-col-2", ".s7-col-3"].forEach((s, k) => {
  const at = [B1 - 0.3, B2 - 0.3, B3 - 0.3][k];
  tl.fromTo(s, {opacity:0, y:120, rotation:k === 1 ? 0 : (k ? 3 : -3)}, {opacity:1, y:0, rotation:0, duration:0.75, ease:"back.out(1.5)"}, at);
  tl.fromTo(s + " .s7-body", {opacity:0, y:20}, {opacity:1, y:0, duration:0.5, ease:"power3.out"}, at + 0.6);
});
// focus: dim others
tl.to(".s7-col-1", {opacity:0.45, scale:0.96, duration:0.4}, B2 - 0.3);
tl.to(".s7-col-2", {opacity:0.45, scale:0.96, duration:0.4}, B3 - 0.3);
tl.to([".s7-col-1", ".s7-col-2"], {opacity:1, scale:1, duration:0.5, ease:"power2.out"}, D - 2.2);
// art 1: launches
rockets.forEach(([e, tr], k) => {
  const t0 = B1 + 0.4 + k * 0.32;
  tl.fromTo(e, {y:0}, {y:-230, duration:1.1, ease:"power3.out"}, t0);
  tl.fromTo(tr, {opacity:0, y:0}, {opacity:1, y:-160, duration:1.1, ease:"power3.out"}, t0);
  tl.to(e, {y:-20, rotation:120, duration:0.9, ease:"power2.in"}, t0 + 2.2);
  tl.to(tr, {opacity:0, duration:0.4}, t0 + 1.4);
});
tl.fromTo(".s7-hurt", {opacity:0, scale:0.5}, {opacity:1, scale:1, duration:0.4, ease:"back.out(3)"}, B1 + 3.0);
// art 2: signals -> Jev
[".s7-chip-1", ".s7-chip-2", ".s7-chip-3", ".s7-chip-4"].forEach((s, k) => {
  tl.fromTo(s, {opacity:0, x:-30}, {opacity:1, x:0, duration:0.35, ease:"power3.out"}, B2 + 0.4 + k * 0.18);
});
tl.fromTo(".s7-arrow", {opacity:0, x:-20}, {opacity:1, x:0, duration:0.4, ease:"power3.out"}, B2 + 1.5);
tl.fromTo(".s7-jev", {opacity:0, y:-10}, {opacity:1, y:0, duration:0.4, ease:"power3.out"}, B2 + 1.9);
tl.fromTo(".s7-bubble", {opacity:0, scale:0.6}, {opacity:1, scale:1, duration:0.5, ease:"back.out(2)", transformOrigin:"0% 100%"}, B2 + 2.3);
tl.to([".s7-chip-1", ".s7-chip-2", ".s7-chip-3", ".s7-chip-4"], {opacity:0.35, duration:0.4}, B2 + 2.6);
// art 3: TH/EN toggle flips
tl.fromTo(".s7-say-en", {opacity:0}, {opacity:0, duration:0.01}, 0);
const flips = [B3 + 1.2, B3 + 2.6, B3 + 4.0, B3 + 5.4].filter(t => t < D - 1.6);
flips.forEach((t, k) => {
  const toEn = k % 2 === 0;
  tl.to(".s7-knob", {x:toEn ? 110 : 0, duration:0.35, ease:"back.out(1.8)"}, t);
  tl.to(".s7-tl-th", {color:toEn ? "#26211B" : "#FFFDF7", duration:0.2}, t + 0.05);
  tl.to(".s7-tl-en", {color:toEn ? "#FFFDF7" : "#26211B", duration:0.2}, t + 0.05);
  tl.to(toEn ? ".s7-say-th" : ".s7-say-en", {opacity:0, y:-20, duration:0.25}, t);
  tl.fromTo(toEn ? ".s7-say-en" : ".s7-say-th", {opacity:0, y:20}, {opacity:1, y:0, duration:0.35, ease:"power3.out", immediateRender:false}, t + 0.15);
});
tl.fromTo(".s7-say-th", {opacity:0, y:20}, {opacity:1, y:0, duration:0.4, ease:"power3.out"}, B3 + 0.4);
tl.to(".s7-cam", {opacity:0, duration:0.3}, D - 0.35);
window.__timelines["s7-why"] = tl;
})();
</script>
